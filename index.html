<body><noscript><h1>محمد ياسر</h1><p>طالب تكنولوجيا التعليم · مصمّم منصات تعليمية</p><p>طالب في كلية التربية النوعية، قسم تكنولوجيا التعليم. بحب أحوّل الأفكار لمنصات وتطبيقات تعليمية بالعربي تتجرّب فعلاً وتفيد الناس. بتعلّم كل يوم في التصميم والبرمجة وصناعة المحتوى، وبدوّر على فرصة أبدأ بيها أول خطوة عملية في مجالي.</p><ul><li>منصة الخبير التعليمية — منصة بأربعة أدوار (طالب، ولي أمر، معلم، إدارة): كورسات، اختبارات، واجبات، حصص مباشرة وتقارير.</li><li>منصة نُخبة التعليمية — نظام إدارة تعلّم متكامل بخمسة أدوار وأكتر من ٣٠ شاشة، مبني على React وSupabase.</li><li>منصة الدكتور التعليمية — منصة للطلاب وأولياء الأمور والمعلمين والإدارة: كورسات واختبارات وربط مع واتساب.</li><li>حافظ القرآن — تطبيق لتحفيظ القرآن: مصحف كامل بالصوت، اختبارات، لوحة ترتيب، ويتثبّت كتطبيق على الموبايل.</li><li>صانع التطبيقات — فكرة منصة تحوّل وصف بالعربي لتطبيق جاهز، مع عرض الكود وتحميل APK.</li></ul><ul><li>تصميم المنصات والتطبيقات التعليمية</li><li>كتابة الأفكار والمتطلبات</li><li>صناعة المحتوى التعليمي</li><li>التعلّم الذاتي</li><li>التصميم والجرافيكس</li><li>مايكروسوفت أوفيس</li><li>كتابة المحتوى</li><li>ريادة الأعمال</li><li>مونتاج الفيديو</li><li>البرمجة وتطوير الويب</li><li>الذكاء الاصطناعي واستخدام الأدوات</li><li>اللغة الإنجليزية</li><li>مهارات العرض والتواصل</li><li>التسويق الرقمي</li><li>إدارة الوقت والإنتاجية</li></ul></noscript>

function seo(){const sm=(n,v,a)=>{let e=document.head.querySelector('meta['+a+'="'+n+'"]');if(!e){e=document.createElement('meta');e.setAttribute(a,n);document.head.appendChild(e)}e.setAttribute('content',v)},dsc=S.me.name+' — '+(S.hero.role||'')+'. '+S.me.bio;
sm('description',dsc,'name');sm('og:title',document.title,'property');sm('og:description',dsc,'property');sm('og:type','profile','property');
let l=document.getElementById('ld');if(!l){l=document.createElement('script');l.id='ld';l.type='application/ld+json';document.head.appendChild(l)}
l.textContent=JSON.stringify({"@context":"https://schema.org","@type":"Person",name:S.me.name,jobTitle:S.hero.role,description:S.me.bio,sameAs:S.socials.map(s=>s.u).filter(u=>u&&u!='#')}).replace(/</g,'\\u003c')}
function buildHTML(){const cl=document.documentElement.cloneNode(true),a=D.ar,ns=document.createElement('noscript');cl.querySelector('#app').innerHTML='';cl.removeAttribute('data-theme');cl.setAttribute('dir','rtl');cl.setAttribute('lang','ar');cl.querySelectorAll('.mod').forEach(e=>e.remove());cl.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
ns.innerHTML='<h1>'+esc(a.me.name)+'</h1><p>'+esc(a.hero.role)+'</p><p>'+esc(a.me.bio)+'</p><ul>'+a.projects.map(p=>'<li>'+esc(p.t)+' — '+esc(p.x)+'</li>').join('')+'</ul><ul>'+a.skills.map(k=>'<li>'+esc(k.t)+'</li>').join('')+'</ul>';cl.querySelector('body').prepend(ns);return '<!DOCTYPE html>\n'+cl.outerHTML}
async function dl(html){try{const d=await claude.use('downloads');if(d){await d.save({filename:'index.html',data:html});return}}catch(x){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';a.click()}
document.addEventListener('change',e=>{const t=e.target;if(!edit)return;
if(t.dataset?.sel){snap(1);let v=t.value;if(v=='__new'){v=(prompt('اسم التصنيف الجديد:')||'').trim();if(!v)return render();const L=get(t.dataset.list);if(!L.includes(v))L.push(v)}set(t.dataset.sel,v);render()}
else if(t.dataset?.mv){snap(1);const a=t.dataset.mv.split('.'),it=S.groups[+a[1]].items.splice(+a[3],1)[0];S.groups[+t.value].items.push(it);render()}});
function projs(){return `<section><div class="k">— أعمالي</div><h1>${T('pt')}</h1><p class="mu">${T('ps')}</p>${chipRow(pflt,S.pcats,'data-pf')}<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${S.projects.map((o,i)=>!pflt||o.c==pflt?pj(i):'').join('')}</div>${A('projects','مشروع','proj')}</section>`}
function skillsPg(){const fl=S.skills.map((x,i)=>[x,i]).filter(([x])=>!sflt||x.c==sflt);return `<section><div class="k">— ${esc(S.ui.skt)}</div><h1>${esc(S.ui.sk1)}</h1><p class="mu">${T('sks')}</p>${chipRow(sflt,S.scats,'data-sf')}${fl.map(([x,i])=>{const p='skills.'+i;return `<div class="card in" style="margin-top:22px;position:relative">${X(p)}<span class="k">${CAT(p+'.c','scats')}</span><h2 style="margin:0">${T(p+'.t')}</h2><small class="mu">${T(p+'.l')}%</small><div class="bar"><i style="width:${Math.min(100,+x.l||0)}%"></i></div><p class="mu">${T(p+'.d')}</p><div class="grid">${(x.ps||[]).map((q,j)=>`<div class="card">${X(p+'.ps.'+j)}${IMG(p+'.ps.'+j+'.img')}<div class="in">${L(p+'.ps.'+j+'.u',T(p+'.ps.'+j+'.t','b'))}<br><small class="mu">${T(p+'.ps.'+j+'.x')}</small></div></div>`).join('')}</div>${A(p+'.ps','مشروع لهذه المهارة','sp')}</div>`}).join('')}${A('skills','مهارة','sk')}</section>`}
function certsPg(){return `<section><div class="k">— ${esc(S.ui.skt)}</div><h1>${esc(S.ui.ce1)}</h1><p class="mu">${T('cis')}</p><div class="grid">${S.certs.map((x,i)=>`<div class="card">${X('certs.'+i)}${IMG(`certs.${i}.img`)}<div class="in">${L(`certs.${i}.u`,T(`certs.${i}.t`,'b'))}<br><small class="mu">${T(`certs.${i}.d`)}</small></div></div>`).join('')}</div>${A('certs','شهادة','ce')}</section>`}
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});
const pick=(a='image/*')=>new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept=a;i.onchange=()=>r(i.files[0]);i.click()});
async function shrink(f){const b=await createImageBitmap(f),m=Math.min(1,800/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*m;c.height=b.height*m;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.82)}
document.addEventListener('input',e=>{if(edit&&e.target.dataset?.m){set(e.target.dataset.m,e.target.value);return}const p=e.target.dataset?.p;if(edit&&p)set(p,e.target.textContent)});
document.addEventListener('keydown',e=>{if(edit&&e.key==='Enter'&&e.target.dataset?.p)e.preventDefault()});
document.addEventListener('paste',e=>{if(edit&&e.target.dataset?.p){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))}});
document.addEventListener('click',async e=>{const t=e.target,c=s=>t.closest(s);
const lk=c('a[data-k]');if(lk&&!owner)track('c:'+lk.textContent.trim().slice(0,40));
if(c('[data-cl]')){document.querySelectorAll('.mod').forEach(m=>m.remove());return}
if(c('#px')){document.getElementById('pnl').remove();return render()}
if(c('#ph2')){const fl=await pick();if(fl){snap(1);set('me.photo',await shrink(fl))}return}
const dm=c('[data-dm]');if(dm&&DB){try{await DB.collection('inbox').doc(dm.dataset.dm).delete();dm.closest('.lnk').remove()}catch(x){}return}
const cp=c('#cp');if(cp){try{await navigator.clipboard.writeText(cp.dataset.em);cp.textContent='✓'}catch(x){}return}
if(c('#ex')){dl(buildHTML());return}const pf=c('[data-pf]');if(pf){pflt=pf.dataset.pf;return render()}const sf=c('[data-sf]');if(sf){sflt=sf.dataset.sf;return render()}
const sj=c('[data-sj]');if(sj){document.getElementById('sk'+sj.dataset.sj)?.scrollIntoView({behavior:'smooth'});return}
if(c('#ad'))return openAdd();const qa=c('[data-qa]');if(qa)return doAdd(qa.dataset.qa);
if(c('#sb'))return openSearch();if(c('#nl-b'))return subscribe();if(c('#f-s'))return sendMsg();if(c('#da'))return openDash();
if(c('#lg')){if(LNG=='ar'){if(!D.en){D.en=JSON.parse(JSON.stringify(D.ar));D.en.ui=ENUI;D.en.sub.t='Subscribe'}LNG='en'}else LNG='ar';S=D[LNG];try{localStorage.lng=LNG}catch(x){}return render()}
if(c('#me'))return openPanel();if(c('#ai'))return aiRun();if(c('#bk'))return backup();if(c('#rs'))return restore();
if(c('#un')){if(hist.length){D=JSON.parse(hist.pop());S=D[LNG]||D.ar;render()}return}

if(c('#tg')){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=cur=='dark'?'light':'dark';return}
const f=c('[data-f]');if(f&&!edit){flt=f.dataset.f;return render()}
const dj=c('[data-j]');if(dj){const sec=document.getElementById('cos');scrollTo({top:sec.offsetTop+(+dj.dataset.j/Math.max(1,S.tl.length-1))*(sec.offsetHeight-sec.firstChild.clientHeight)+2,behavior:'smooth'});return}
if(c('#eb')){edit=true;flt='';return render()}
if(c('#cn')){D=JSON.parse(document.getElementById('data').textContent);if(!D[LNG])LNG='ar';S=D[LNG];edit=false;return render()}
if(c('#sv')){try{if(art)await art.publish(buildHTML());else{await dl(buildHTML())}}catch(x){alert('تعذر النشر: '+(x.code||x.message))}return}
if(!edit)return;
const d=c('[data-del]');if(d){snap(1);const a=d.dataset.del.split('.'),i=+a.pop();get(a.join('.')).splice(i,1);return render()}
const ad=c('[data-add]');if(ad){snap(1);const n=NEW[ad.dataset.ty],v=typeof n=='string'?n:JSON.parse(JSON.stringify(n));if(ad.dataset.c)v.c=ad.dataset.c;if(ad.dataset.add=='projects')v.c=S.pcats[0]||'';if(ad.dataset.add=='skills')v.c=S.scats[0]||'';get(ad.dataset.add).push(v);return render()}
const im=c('[data-img]');if(im){const fl=await pick();if(fl){snap(1);set(im.dataset.img,await shrink(fl));render()}return}
const u=c('[data-u]');if(u){const v=prompt('الرابط:',get(u.dataset.u));if(v!==null){set(u.dataset.u,v);render()}}
});
render();
(async()=>{try{const u=await claude.use('user');owner=!!u?.isOwner();art=owner?await claude.use('artifact'):null;if(!art)owner=false}catch(e){}
if(!owner&&location.hash=='#edit'){const pw=prompt('كلمة السر:');if(pw!==null&&pw==(D.ar.pass||'1234')){owner=true;art=null}}
ready=true;render()})();
</script>
</body>
</html>
